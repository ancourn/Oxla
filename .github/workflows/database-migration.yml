name: Database Migration

on:
  push:
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
    branches: [ main, develop ]

jobs:
  migrate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma Client
      run: npx prisma generate
    
    - name: Run database migration (Production)
      if: github.ref == 'refs/heads/main'
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    
    - name: Run database migration (Staging)
      if: github.ref == 'refs/heads/develop'
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.event.commits[0].message, '[rollback]')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma Client
      run: npx prisma generate
    
    - name: Rollback database migration (Production)
      if: github.ref == 'refs/heads/main'
      run: npx prisma migrate resolve --rolled-back
      env:
        DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    
    - name: Rollback database migration (Staging)
      if: github.ref == 'refs/heads/develop'
      run: npx prisma migrate resolve --rolled-back
      env:
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}